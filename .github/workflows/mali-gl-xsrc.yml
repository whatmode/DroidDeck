name: Mali GL Xwayland/gamescope source export

on:
  push:
    branches: [ mali-gl ]
    paths:
      - '.github/workflows/mali-gl-xsrc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sources
        run: |
          set -x
          mkdir -p x && cd x
          exec > >(tee ../fetch.log) 2>&1
          git clone -q --depth 1 https://gitlab.archlinux.org/archlinux/packaging/packages/xorg-xwayland.git arch-xwayland || echo "FAIL arch clone"
          ver=$(sed -n 's/^pkgver=//p' arch-xwayland/PKGBUILD 2>/dev/null)
          [ -n "$ver" ] || ver=24.1.8
          echo "xwayland $ver" > ../VERSIONS
          for u in "https://xorg.freedesktop.org/archive/individual/xserver/xwayland-$ver.tar.xz" \
                   "https://www.x.org/releases/individual/xserver/xwayland-$ver.tar.xz"; do
            curl -fsSL "$u" -o xw.tar.xz && break || echo "FAIL $u"
          done
          tar xJf xw.tar.xz && mv "xwayland-$ver" xwayland && rm -rf xwayland/test xwayland/doc || echo "FAIL xwayland extract"
          git clone -q --depth 1 --branch 3.16.29 https://github.com/ValveSoftware/gamescope.git gamescope || echo "FAIL gamescope clone"
          if [ -d gamescope ]; then
            (cd gamescope && git submodule update --init --depth 1 subprojects/wlroots) || echo "FAIL wlroots submodule"
            rm -rf gamescope/.git gamescope/subprojects/*/.git
          fi
          echo "gamescope 3.16.29" >> ../VERSIONS
          rm -rf arch-xwayland/.git
          true
      - name: Publish to mali-gl-xsrc
        run: |
          set -euxo pipefail
          git config user.name mali-gl-xsrc
          git config user.email mali-gl-xsrc@users.noreply.github.com
          git worktree add -q --detach ../out
          cd ../out
          git checkout -q --orphan mali-gl-xsrc
          git rm -rfq . || true
          for d in xwayland gamescope arch-xwayland; do [ -d "$GITHUB_WORKSPACE/x/$d" ] && cp -r "$GITHUB_WORKSPACE/x/$d" . || true; done
          cp "$GITHUB_WORKSPACE/VERSIONS" "$GITHUB_WORKSPACE/fetch.log" .
          find . -size +5M -type f -delete
          git add -A
          git commit -qm "Xwayland + gamescope sources for mali-gl"
          git push -fq origin mali-gl-xsrc
