name: Mali GL source export

on:
  push:
    branches: [ mali-gl ]
    paths:
      - '.github/workflows/mali-gl-src.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      ZENITHBLUE_REF: 5b87b74d3e2580d5816e7f2c629f6f016a462f28
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Mesa and apply the kbase series
        run: |
          set -euo pipefail
          git init -q zb
          git -C zb fetch -q --depth 1 https://github.com/zenithblue-oss/panvk-kbase-android "$ZENITHBLUE_REF"
          git -C zb checkout -q FETCH_HEAD
          zb/scripts/fetch-mesa.sh "$PWD/work" > fetch.log 2>&1 || { tail -20 fetch.log; exit 1; }
          zb/scripts/apply-patches.sh --profile g615-v11-csf --mesa "$PWD/work/mesa" | tail -1
      - name: Publish the source subset to mali-gl-src
        run: |
          set -euo pipefail
          M=work/mesa
          rm -rf ../src && mkdir ../src && cd ../src
          git init -q -b mali-gl-src
          for d in src/gallium/drivers/panfrost src/gallium/winsys/panfrost src/gallium/winsys/kmsro \
                   src/panfrost/lib src/panfrost/vulkan src/panfrost/genxml src/panfrost/compiler/bifrost/valhall/ISA.xml \
                   src/loader src/gbm src/egl/drivers/dri2 src/gallium/frontends/dri \
                   src/gallium/auxiliary/pipe-loader src/gallium/auxiliary/renderonly \
                   include/drm-uapi src/util/libsync.h src/util/os_time.h src/vulkan/runtime/vk_sync.h \
                   meson.build meson.options src/panfrost/meson.build; do
            if [ -e "$GITHUB_WORKSPACE/$M/$d" ]; then mkdir -p "$(dirname "$d")"; cp -r "$GITHUB_WORKSPACE/$M/$d" "$d"; fi
          done
          echo "Mesa $(git -C "$GITHUB_WORKSPACE/$M" rev-parse HEAD) + zenithblue $ZENITHBLUE_REF g615-v11-csf" > SOURCE
          git config user.name mali-gl-src; git config user.email mali-gl-src@users.noreply.github.com
          git add -A && git commit -qm "Mesa subset with the kbase series ($ZENITHBLUE_REF)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" mali-gl-src
          du -sh .
