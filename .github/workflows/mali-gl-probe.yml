name: Mali GL probe

on:
  push:
    paths:
      - 'mali-gl/**'
      - '.github/workflows/mali-gl-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mali-gl-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      ZENITHBLUE_REF: 5b87b74d3e2580d5816e7f2c629f6f016a462f28
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build pkg-config bison flex python3-mako python3-yaml python3-ply python3-pip \
            clang llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev llvm-spirv-18 \
            libllvmspirvlib-18-dev spirv-tools glslang-tools libelf-dev zlib1g-dev libexpat1-dev \
            libdrm-dev libwayland-dev wayland-protocols libwayland-egl-backend-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxcb-glx0-dev libxcb-shm0-dev \
            libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxshmfence-dev libxxf86vm-dev libxrandr-dev >/dev/null
          pip install --break-system-packages -q 'meson>=1.4'
          meson --version

      - name: Fetch the PanVK kbase series
        run: |
          set -euo pipefail
          git init -q zb
          git -C zb fetch -q --depth 1 https://github.com/zenithblue-oss/panvk-kbase-android "$ZENITHBLUE_REF"
          git -C zb checkout -q FETCH_HEAD

      - name: Probe
        run: bash mali-gl/scripts/probe.sh zb out

      - name: Publish results to the mali-gl-results branch
        if: always()
        run: |
          set -euo pipefail
          [ -d out ] || exit 0
          dest=results/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          git config user.name "mali-gl-probe"
          git config user.email "mali-gl-probe@users.noreply.github.com"
          git fetch -q origin mali-gl-results || true
          if git rev-parse -q --verify origin/mali-gl-results >/dev/null; then
            git worktree add -q ../results origin/mali-gl-results
            git -C ../results checkout -q -B mali-gl-results
          else
            git worktree add -q --detach ../results
            git -C ../results checkout -q --orphan mali-gl-results
            git -C ../results rm -rfq . || true
          fi
          mkdir -p "../results/$dest"
          cp out/*.txt "../results/$dest/"
          for f in configure.log apply.log; do [ -f out/$f ] && tail -c 200000 out/$f > "../results/$dest/$f"; done
          [ -f out/build.log ] && grep -nE -B3 -A6 "error:" out/build.log | head -c 1500000 > "../results/$dest/build-errors-context.log" || true
          rm -rf ../results/latest && cp -r "../results/$dest" ../results/latest
          git -C ../results add -A
          git -C ../results commit -qm "probe ${GITHUB_SHA::7}: $(head -c 200 out/summary.txt | tr '\n' ' ')"
          git -C ../results push -q origin mali-gl-results
          cat out/summary.txt
