name: EA client build

on:
  push:
    branches: [mali-gl]
    paths:
      - 'tools/ea/**'
      - '.github/workflows/ea-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ea-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler pkg-config build-essential
          rustup toolchain install nightly-2026-01-20 --profile minimal
          rustup default nightly-2026-01-20
          rustc -V; cargo -V; protoc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ea-cargo-${{ hashFiles('tools/ea/MAXIMA_REV') }}
      - name: Build
        run: |
          set -o pipefail
          bash tools/ea/build.sh out 2>&1 | tee build.log
      - name: Report the build failure
        if: failure()
        run: |
          { grep -E "^(error|warning: unused)" -A12 build.log | head -150; } > err.txt || true
          [ -s err.txt ] || tail -80 build.log > err.txt
          msg=$(sed 's/%/%25/g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=EA build failed::${msg}"
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=ea-latest
          notes="Built from ${GITHUB_SHA::7}. Unpack and click droiddeck-ea/run-eatest.sh."
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "EA client test build" --notes "$notes"
          gh release edit "$tag" --notes "$notes"
          gh release upload "$tag" out/droiddeck-ea-aarch64.tar.gz --clobber
          vtag=ea-${GITHUB_SHA::7}
          gh release view "$vtag" >/dev/null 2>&1 \
            || gh release create "$vtag" --prerelease --target "$GITHUB_SHA" --title "$vtag" --notes "droiddeck-ea for the apk, sha256 $(cat out/droiddeck-ea.sha256)"
          gh release upload "$vtag" out/droiddeck-ea-aarch64.tar.gz --clobber
