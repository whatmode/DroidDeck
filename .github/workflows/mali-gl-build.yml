name: Mali GL build

on:
  push:
    branches: [mali-gl]
    paths:
      - 'mali-gl/**'
      - '.github/workflows/mali-gl-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mali-gl-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      ZENITHBLUE_REF: 5b87b74d3e2580d5816e7f2c629f6f016a462f28
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ninja-build pkg-config bison flex python3-mako python3-yaml python3-ply python3-pip \
            clang llvm-18-dev libclang-18-dev libclang-cpp18-dev libclc-18-dev llvm-spirv-18 \
            libllvmspirvlib-18-dev spirv-tools glslang-tools libelf-dev zlib1g-dev libexpat1-dev \
            libdrm-dev libwayland-dev wayland-protocols libwayland-egl-backend-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxcb-glx0-dev libxcb-shm0-dev \
            libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-sync-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxshmfence-dev libxxf86vm-dev libxrandr-dev >/dev/null
          pip install --break-system-packages -q 'meson>=1.4'

      - name: Fetch the PanVK kbase series
        run: |
          set -euo pipefail
          git init -q zb
          git -C zb fetch -q --depth 1 https://github.com/zenithblue-oss/panvk-kbase-android "$ZENITHBLUE_REF"
          git -C zb checkout -q FETCH_HEAD

      - name: Build
        id: build
        run: bash mali-gl/scripts/build.sh zb out

      - name: Upload the package as a release asset
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=mali-gl-latest
          notes="Built from ${GITHUB_SHA::7}. Unpack and run mali-gl/run-gltest.sh."
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "mali-gl test build" --notes "$notes"
          gh release edit "$tag" --notes "$notes"
          gh release upload "$tag" out/mali-gl-aarch64.tar.gz --clobber

      - name: Publish results to the mali-gl-results branch
        if: always()
        run: |
          set -euo pipefail
          [ -d out ] || exit 0
          dest=results/build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          git config user.name "mali-gl-build"
          git config user.email "mali-gl-build@users.noreply.github.com"
          git fetch -q origin mali-gl-results || true
          if git rev-parse -q --verify origin/mali-gl-results >/dev/null; then
            git worktree add -q ../results origin/mali-gl-results
            git -C ../results checkout -q -B mali-gl-results
          else
            git worktree add -q --detach ../results
            git -C ../results checkout -q --orphan mali-gl-results
            git -C ../results rm -rfq . || true
          fi
          mkdir -p "../results/$dest"
          cp out/*.txt "../results/$dest/" 2>/dev/null || true
          for f in configure.log apply.log install.log gltest-build.log; do [ -f out/$f ] && tail -c 200000 out/$f > "../results/$dest/$f"; done
          rm -rf ../results/results/build-latest && cp -r "../results/$dest" ../results/results/build-latest
          git -C ../results add -A
          git -C ../results commit -qm "build ${GITHUB_SHA::7}: $(tail -c 200 out/summary.txt | tr '\n' ' ')"
          git -C ../results push -q origin mali-gl-results
          cat out/summary.txt
